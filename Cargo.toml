[package]
name = "decentralized-root-of-trust"
version = "0.1.0"
edition = "2024"

[dependencies]
# leanVM: the SNARK prover that aggregates the XMSS signatures into a single
# proof. v0.10 uses binary fields and BLAKE2s. The application message uses the
# exact same BLAKE2s implementation
# through the `primitives` workspace crate.
#
# Pinned to the `v0.10` tag by its commit, not by the tag name: a tag can be
# moved, a commit cannot. This is a cryptographic and wire-format break: v0.9
# keys, signatures, aggregates and status-list messages must be regenerated.
leanvm = { git = "https://github.com/leanEthereum/leanVM.git", rev = "73a5f5dcd34d8dfe76a32a44dce0c0f87c86feeb" }
leanvm-primitives = { package = "primitives", git = "https://github.com/leanEthereum/leanVM.git", rev = "73a5f5dcd34d8dfe76a32a44dce0c0f87c86feeb" }

rand = "0.10"
sha3 = "0.10.8"

# Canonical, schema-driven wire format for every published object. Since leanVM
# v0.10 this covers the leanVM types too: `XmssPublicKey` (32 B) and
# `XmssSignature` (1208 B) implement SSZ natively. They are byte-oriented in
# v0.10, so exact SSZ lengths — rather than field-modulus checks — define their
# canonical schema.
ssz = { package = "ethereum_ssz", version = "0.10.4" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.10.1" }
# Only to name the compile-time ceiling on the signer bitmap: SSZ BitList takes
# its maximum as a type-level integer. Already in the tree via `ssz`, so this
# adds no crate, only the ability to write the bound down.
typenum = "1"

# Not used by the library: the local scratch binaries (`src/bin/my_test*.rs`,
# gitignored) build JCS-canonical JSON credentials with them.
serde_json = "1.0"
serde_jcs  = "0.2"

# `tests/snark_path.rs` runs a real leanVM prover, which is not usable at
# `opt-level = 0`. Optimizing the *dependencies* only leaves this crate itself
# unoptimized, so `cargo test` keeps its debug info, assertions and integer
# overflow checks. The release profile is untouched.
[profile.dev.package."*"]
opt-level = 3

# v0.10's aggregation warm-up builds a shape-only placeholder layout with dummy
# table heights of `1 << 10`; `lean_vm` then shifts by those synthetic heights.
# Release builds intentionally run with overflow checks off, but a dependency
# built in the dev profile would panic before any proof is made. Scope the
# production-equivalent arithmetic to that upstream package only: this crate and
# every other dependency retain their normal dev overflow checks.
[profile.dev.package.lean_vm]
overflow-checks = false
