[package]
name = "decentralized-root-of-trust"
version = "0.1.0"
edition = "2024"

[dependencies]
# leanVM: the SNARK prover that aggregates the XMSS signatures into a single
# proof. leanVM ships its own field/hash backend and does NOT depend on
# Plonky3, so the whole dependency tree is git-pinned and reproducible.
lean-multisig = { git = "https://github.com/leanEthereum/leanVM.git", rev = "12e61512416548e743040aab4daf83c58a5c5476" }
backend       = { git = "https://github.com/leanEthereum/leanVM.git", rev = "12e61512416548e743040aab4daf83c58a5c5476" }

rand = "0.10"
sha3 = "0.10.8"


# serde binary format used to (de)serialize the leanVM aggregate stored in the
# StatusList `zk_proof` field. Same format leanVM uses internally.
postcard = { version = "1.1.3", features = ["alloc"] }
# Needed to serialize the published StatusList and the committee anchor, so the
# prover and the verifier can live in two separate processes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs  = "0.2"

# `tests/snark_path.rs` runs a real leanVM prover, which is not usable at
# `opt-level = 0` — plain `cargo test` would otherwise take hours instead of
# seconds. Optimizing the *dependencies* only leaves this crate itself
# unoptimized, so `cargo test` keeps its debug info, its assertions and its
# integer-overflow checks. The release profile, which the benchmark measures, is
# untouched.
[profile.dev.package."*"]
opt-level = 3
