[package]
name = "decentralized-root-of-trust"
version = "0.1.0"
edition = "2024"

[dependencies]
# leanVM: the SNARK prover that aggregates the XMSS signatures into a single
# proof. leanVM ships its own field/hash backend and does NOT depend on
# Plonky3, so the whole dependency tree is git-pinned and reproducible.
#
# Pinned to the `v0.9` tag by its commit, not by the tag name: a tag can be moved,
# a commit cannot. v0.9 is a breaking release — keys, signatures and proofs from
# any earlier revision are rejected, so artifacts must be regenerated after a
# bump (see AGENTS.md, "leanVM constraints").
lean-multisig = { git = "https://github.com/leanEthereum/leanVM.git", rev = "a5909d18647de6aed38640c098d9177fab2bf36a" }
backend       = { git = "https://github.com/leanEthereum/leanVM.git", rev = "a5909d18647de6aed38640c098d9177fab2bf36a" }

rand = "0.10"
sha3 = "0.10.8"

# Canonical, schema-driven wire format for every published object. Since leanVM
# v0.9 this covers the leanVM types too: `XmssPublicKey` (32 B) and
# `XmssSignature` (1208 B) implement SSZ natively, with non-canonical field
# elements rejected on decode, so nothing here has to canonicalize them by hand.
ssz = { package = "ethereum_ssz", version = "0.10.4" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.10.1" }
# Only to name the compile-time ceiling on the signer bitmap: SSZ BitList takes
# its maximum as a type-level integer. Already in the tree via `ssz`, so this
# adds no crate, only the ability to write the bound down.
typenum = "1"

# Not used by the library: the local scratch binaries (`src/bin/my_test*.rs`,
# gitignored) build JCS-canonical JSON credentials with them.
serde_json = "1.0"
serde_jcs  = "0.2"

# `tests/snark_path.rs` runs a real leanVM prover, which is not usable at
# `opt-level = 0` — plain `cargo test` would otherwise take hours instead of
# seconds. Optimizing the *dependencies* only leaves this crate itself
# unoptimized, so `cargo test` keeps its debug info, its assertions and its
# integer-overflow checks. The release profile, which the benchmark measures, is
# untouched.
[profile.dev.package."*"]
opt-level = 3
